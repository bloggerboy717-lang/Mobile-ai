name: Build Alic AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Android SDK & Accept Licenses
        run: |
          echo "Setting up Android SDK environment..."
          echo "ANDROID_HOME: $ANDROID_HOME"
          # Accept all Android SDK licenses so Gradle can download any needed SDK platforms automatically
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare build environment files
        run: |
          # Ensure .env exists for the Secrets Gradle Plugin
          if [ ! -f .env ]; then
            echo "Creating dummy .env file for build configuration..."
            touch .env
          fi

          # Ensure debug.keystore exists for debug signingConfig
          if [ ! -f debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure gradlew has execution rights
          chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify generated APK exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "SUCCESS: APK generated at $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: Expected APK not found at $APK_PATH"
            exit 1
          fi

      - name: Prepare Direct APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/Alic-AI.apk
          ls -lh release-apk/Alic-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alic-AI-apk
          path: release-apk/Alic-AI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases (No ZIP, Single Click)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0
          name: "Alic AI v1.0 Direct APK"
          body: |
            ## 📱 Alic AI - Native Android AI Voice Assistant
            **Developer:** Rohit Raj

            ### 🚀 Direct APK Download (बिना ZIP के डायरेक्ट डाउनलोड):
            Click on **`Alic-AI.apk`** below under Assets to download directly on your Android phone with 1 click. No ZIP file and no terminal required!

            #### Key Features:
            - **Gemini Persona (Non-Robotic)**: Ultra natural, conversational voice assistant.
            - **Continuous Hands-Free Conversation**: Tap mic once, then speak back and forth freely without clicking mic again.
            - **Accessibility Automation**: Automatic YouTube playback (*"YouTube ओपन करके यो यो हनी सिंह का पहला गाना प्ले करो"*).
            - **Agentic Phone Control**: Torch, Apps, Maps, Volume, Clock, and Screen Vision.
          files: release-apk/Alic-AI.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
